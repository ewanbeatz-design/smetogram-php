name: Deploy to REG.RU

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.2
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_VISION_MODEL: ${{ secrets.GROQ_VISION_MODEL }}
        with:
          host: ${{secrets.REG_RU_HOST}}
          username: ${{secrets.REG_RU_USER}}
          key: ${{secrets.REG_RU_SSH_KEY}}
          envs: GROQ_API_KEY,GROQ_VISION_MODEL
          script: |
            set -e
            cd ${{secrets.REG_RU_PATH}}

            if [ ! -d .git ]; then
              git init
              git remote add origin https://github.com/ewanbeatz-design/smetogram-php.git
            fi

            git reset --hard HEAD || true
            git fetch origin main
            git checkout -B main origin/main
            git reset --hard origin/main
            rm -f index.html

            mkdir -p config
            cat > config/config.php <<'PHP'
            <?php
            declare(strict_types=1);

            return [
                'db' => [
                    'host' => 'localhost',
                    'port' => 3306,
                    'name' => 'u1027561_default',
                    'user' => 'u1027561_default',
                    'password' => '${{secrets.REG_RU_DB_PASSWORD}}',
                    'charset' => 'utf8mb4',
                ],
                'app' => [
                    'name' => 'Сметограм',
                    'url' => 'https://сметограм.рф',
                ],
                'ai' => [
                    'groq_api_key' => '__GROQ_API_KEY__',
                    'groq_vision_model' => '__GROQ_VISION_MODEL__',
                ],
                'telegram' => [
                    'bot_username' => 'smetogram_auth_bot',
                    'bot_token' => '${{secrets.TELEGRAM_BOT_TOKEN}}',
                    'client_id' => '${{secrets.TELEGRAM_CLIENT_ID}}',
                    'client_secret' => '${{secrets.TELEGRAM_CLIENT_SECRET}}',
                ],
            ];
            PHP

            php -r '$f="config/config.php"; $s=file_get_contents($f); if($s===false){fwrite(STDERR,"CONFIG_READ_ERROR\n");exit(1);} $key=getenv("GROQ_API_KEY")?:""; $model=getenv("GROQ_VISION_MODEL")?:""; if($key===""){fwrite(STDERR,"GROQ_API_KEY_NOT_RECEIVED_BY_SSH\n");exit(1);} if($model===""){fwrite(STDERR,"GROQ_VISION_MODEL_NOT_RECEIVED_BY_SSH\n");exit(1);} $s=str_replace(["__GROQ_API_KEY__","__GROQ_VISION_MODEL__"],[var_export($key,true),var_export($model,true)],$s); if(file_put_contents($f,$s)===false){fwrite(STDERR,"CONFIG_WRITE_ERROR\n");exit(1);} echo "GROQ_CONFIG_INJECTED KEY_LENGTH=".strlen($key)." MODEL=".$model."\n";'

            chmod 640 config/config.php
            /var/www/u1027561/data/bin/composer install --no-interaction --no-dev --prefer-dist --optimize-autoloader

            php -r '$c=require "config/config.php"; if (empty($c["telegram"]["client_id"])) {fwrite(STDERR,"TELEGRAM_CLIENT_ID_NOT_CONFIGURED\n"); exit(1);} if (empty($c["telegram"]["bot_token"])) {fwrite(STDERR,"TELEGRAM_BOT_TOKEN_NOT_CONFIGURED\n"); exit(1);} echo "TELEGRAM_CONFIG_OK\n";'
            php -r '$c=require "config/config.php"; if(empty($c["ai"]["groq_api_key"])){fwrite(STDERR,"GROQ_API_KEY_NOT_CONFIGURED_AFTER_WRITE\n");exit(1);} if(empty($c["ai"]["groq_vision_model"])){fwrite(STDERR,"GROQ_VISION_MODEL_NOT_CONFIGURED_AFTER_WRITE\n");exit(1);} echo "GROQ_CONFIG_OK KEY_LENGTH=".strlen((string)$c["ai"]["groq_api_key"])." MODEL=".$c["ai"]["groq_vision_model"]."\n";'
            php -r '$c=require "config/config.php"; try { new PDO("mysql:host=".$c["db"]["host"].";port=".$c["db"]["port"].";dbname=".$c["db"]["name"].";charset=".$c["db"]["charset"], $c["db"]["user"], $c["db"]["password"], [PDO::ATTR_ERRMODE=>PDO::ERRMODE_EXCEPTION]); echo "DB_CONNECTION_OK\n"; } catch (Throwable $e) { echo "DB_CONNECTION_ERROR: ".$e->getMessage()."\n"; exit(1); }'
            for f in index.php login.php telegram-auth.php register.php dashboard.php project.php catalog.php workspace.php export.php ai.php XlsxWriter.php config/ai.php ai_estimate.php; do php -l "$f"; done
            php -r 'require "vendor/autoload.php"; echo "DOMPDF_AUTOLOAD_OK\n";'
            php -r 'require "config/bootstrap.php"; $checks=["users"=>["id","name","email","password_hash","lastSignedIn","telegramId","telegramUsername"],"projects"=>["id","ownerId","name","city","clientName","workType","status","deadline","budget","updatedAt"],"estimatecategories"=>["id","projectId","name","sortOrder"],"estimateitems"=>["id","categoryId","name","quantity","unit","price","source"],"scheduletasks"=>["id","projectId","title","startsAt","endsAt","status","paymentMilestone"],"projectmembers"=>["id","projectId","invitedEmail","invitedPhone","role","inviteToken"],"projectdocuments"=>["id","projectId","type","title","status","fileUrl","signedAt","createdAt"],"projectmessages"=>["id","projectId","authorId","channel","body","createdAt"],"acceptancestages"=>["id","projectId","scheduleTaskId","title","status","amount","holdback","comment","submittedAt","acceptedAt","createdAt"]]; foreach($checks as $t=>$cols){$q=$pdo->prepare("SELECT COLUMN_NAME FROM INFORMATION_SCHEMA.COLUMNS WHERE TABLE_SCHEMA=DATABASE() AND LOWER(TABLE_NAME)=LOWER(?)");$q->execute([$t]);$have=array_map("strtolower",$q->fetchAll(PDO::FETCH_COLUMN));foreach($cols as $c){if(!in_array(strtolower($c),$have,true)){fwrite(STDERR,"SCHEMA_ERROR: $t.$c\n");exit(1);}}} echo "SMETOGRAM_SCHEMA_OK\n";'
            php -r 'require "config/bootstrap.php"; $pdo->beginTransaction(); try { $openId="smoke_".bin2hex(random_bytes(8)); $q=$pdo->prepare("INSERT INTO users(openId,name,email,loginMethod,role,password_hash,username) VALUES(?,?,?,?,?,?,?)"); $q->execute([$openId,"__SMOKE__",$openId."@example.invalid","password","user",password_hash("Smoke12345",PASSWORD_DEFAULT),$openId]); $uid=(int)$pdo->lastInsertId(); $q=$pdo->prepare("INSERT INTO projects(ownerId,name,city,clientName,workType,status,budget) VALUES(?,?,?,?,?,?,?)"); $q->execute([$uid,"__SMOKE__","Test","Test","Строительство","draft",0]); $pid=(int)$pdo->lastInsertId(); $q=$pdo->prepare("INSERT INTO estimatecategories(projectId,name,sortOrder) VALUES(?,?,?)"); $q->execute([$pid,"__SMOKE__",1]); $cid=(int)$pdo->lastInsertId(); $q=$pdo->prepare("INSERT INTO estimateitems(categoryId,name,quantity,unit,price,source) VALUES(?,?,?,?,?,?)"); $q->execute([$cid,"__SMOKE__",1,"шт.",0,"manual"]); $q=$pdo->prepare("INSERT INTO scheduletasks(projectId,title,status,paymentMilestone) VALUES(?,?,?,?)"); $q->execute([$pid,"__SMOKE__","planned",0]); $q=$pdo->prepare("INSERT INTO projectmembers(projectId,invitedEmail,role,inviteToken) VALUES(?,?,?,?)"); $q->execute([$pid,"smoke@example.invalid","client","smoke_".bin2hex(random_bytes(4))]); $q=$pdo->prepare("INSERT INTO projectdocuments(projectId,type,title,status) VALUES(?,?,?,?)"); $q->execute([$pid,"contract","__SMOKE__","draft"]); $q=$pdo->prepare("INSERT INTO projectmessages(projectId,authorId,channel,body) VALUES(?,?,?,?)"); $q->execute([$pid,$uid,"general","__SMOKE__"]); $q=$pdo->prepare("INSERT INTO acceptancestages(projectId,title,status,amount,holdback) VALUES(?,?,?,?,?)"); $q->execute([$pid,"__SMOKE__","pending",0,0]); $pdo->rollBack(); echo "SMETOGRAM_WRITE_OK\n"; } catch(Throwable $e) { if($pdo->inTransaction())$pdo->rollBack(); fwrite(STDERR,"WRITE_ERROR: ".$e->getMessage()."\n"); exit(1); }'
            echo "SMETOGRAM_DEPLOY_OK"
